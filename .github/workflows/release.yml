name: Release

# A tag vX.Y builds the Windows game with that version and publishes it as a GitHub release, which
# every release of the game checks for at its start (docs/releasing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GODOT: 4.7.2

jobs:
  release:
    name: export and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Godot and its .NET export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          curl -sSL -o godot.zip "$base/Godot_v$GODOT-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          curl -sSL -o templates.tpz "$base/Godot_v$GODOT-stable_mono_export_templates.tpz"
          unzip -q templates.tpz -d "$HOME/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT.stable.mono"
          mv "$HOME"/templates/templates/* "$HOME/.local/share/godot/export_templates/$GODOT.stable.mono/"
          echo "GODOT_BIN=$HOME/godot/Godot_v$GODOT-stable_mono_linux_x86_64/Godot_v$GODOT-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Export
        run: |
          # The game's assembly takes the tag's version, the one every release compares.
          export STILLWAKE_VERSION="${GITHUB_REF_NAME#v}"
          dotnet build Stillwake.sln -c Release
          mkdir -p build/windows
          "$GODOT_BIN" --headless --path game --import || true
          "$GODOT_BIN" --headless --path game --export-release "Windows Desktop" ../build/windows/Stillwake.exe
          test -f build/windows/Stillwake.exe
          cp deploy/launchers/host.cmd deploy/launchers/join.cmd build/windows/
          (cd build/windows && zip -qr ../Stillwake-windows.zip .)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Stillwake-windows.zip --title "Stillwake $GITHUB_REF_NAME" --generate-notes
